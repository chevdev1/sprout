<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@500;600&display=swap');
  :root{
    --bg:#0B0D09; --surface:#14170F; --ink:#0D110C; --ink-2:#171B14;
    --text:#EDEDE2; --text-dim:#9A9C8E;
    --sprout:#D8FF4D; --sprout-deep:#8FB300;
    --line:rgba(255,255,255,.10);
    --radius-lg:20px; --radius-md:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .display{font-family:'Instrument Sans',sans-serif;font-weight:600;letter-spacing:-.01em;}
</style>
</helmet>

<div style="width:1440px;height:900px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;">
  <div style="position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle, rgba(216,255,77,.08), transparent 70%);pointer-events:none;"></div>

  <div style="width:100%;height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative;z-index:1;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg viewBox="0 0 100 100" width="20" height="20"><path fill="var(--sprout)" d="M50 88 C22 84 8 46 30 14 C40 36 46 62 50 88 Z M50 88 C78 84 92 46 70 14 C60 36 54 62 50 88 Z"/></svg>
      <span class="display" style="font-size:16px;">sprout</span>
    </div>
    <div style="width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:16px;">×</div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin-top:16px;position:relative;z-index:1;">
    <div style="width:28px;height:28px;border-radius:50%;background:var(--sprout);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);font-weight:700;">✓</div>
    <div style="width:44px;height:1px;background:var(--sprout);"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:var(--sprout);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);font-weight:700;">✓</div>
    <div style="width:44px;height:1px;background:var(--sprout);"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:var(--ink);border:1px solid var(--sprout);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sprout);">3</div>
    <div style="width:44px;height:1px;background:var(--line);"></div>
    <div style="width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim);">4</div>
  </div>

  <div style="width:640px;margin-top:32px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:40px;position:relative;z-index:1;">
    <div style="font-size:11px;font-weight:600;color:var(--sprout-deep);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Step 3 of 4</div>
    <div class="display" style="font-size:26px;letter-spacing:-.02em;margin-bottom:24px;">Review &amp; confirm.</div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:12px 0;border-bottom:1px solid var(--line);">
        <span style="color:var(--text-dim);">Card type</span><b style="font-weight:500;">Virtual</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:0 0 12px;border-bottom:1px solid var(--line);">
        <span style="color:var(--text-dim);">Funding</span><b style="font-weight:500;">1.20 ETH</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:0 0 12px;border-bottom:1px solid var(--line);">
        <span style="color:var(--text-dim);">Grow-back</span><b style="font-weight:500;">1.5% → AAPL</b>
      </div>
    </div>

    <!-- exact fee table copy from the landing page's Fees section -->
    <div style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;">Fees</div>
    <div style="border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;margin-bottom:28px;">
      <div style="display:flex;justify-content:space-between;padding:13px 16px;background:var(--surface);font-size:12px;color:var(--text-dim);">
        <span>Item</span><span>Cost</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);font-size:13px;">
        <span>Card issuance</span><b style="color:var(--sprout-deep);font-weight:600;">Free</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);font-size:13px;background:rgba(216,255,77,.05);">
        <span>Spend fee, per transaction</span><b style="font-weight:600;">1.0%</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);font-size:13px;">
        <span>Grow-back routing</span><b style="color:var(--sprout-deep);font-weight:600;">No added fee</b>
      </div>
      <div style="display:flex;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);font-size:13px;">
        <span>Monthly balance fee</span><b style="color:var(--sprout-deep);font-weight:600;">None</b>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:13px;color:var(--text-dim);">Back</div>
      <div style="padding:13px 28px;border-radius:999px;background:var(--sprout);color:var(--ink);font-size:14px;font-weight:600;">Confirm &amp; sign</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
