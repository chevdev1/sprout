<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@500;600&display=swap');
  :root{
    --bg:#0B0D09; --surface:#14170F; --ink:#0D110C; --ink-2:#171B14;
    --text:#EDEDE2; --text-dim:#9A9C8E;
    --sprout:#D8FF4D; --sprout-deep:#8FB300;
    --line:rgba(255,255,255,.10);
    --radius-lg:20px; --radius-md:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .display{font-family:'Instrument Sans',sans-serif;font-weight:600;letter-spacing:-.01em;}
</style>
</helmet>

<div style="width:1440px;height:900px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;">
  <div style="position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle, rgba(216,255,77,.08), transparent 70%);pointer-events:none;"></div>

  <div style="width:100%;height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative;z-index:1;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg viewBox="0 0 100 100" width="20" height="20"><path fill="var(--sprout)" d="M50 88 C22 84 8 46 30 14 C40 36 46 62 50 88 Z M50 88 C78 84 92 46 70 14 C60 36 54 62 50 88 Z"/></svg>
      <span class="display" style="font-size:16px;">sprout</span>
    </div>
    <div style="width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:16px;">×</div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin-top:16px;position:relative;z-index:1;">
    <div style="width:28px;height:28px;border-radius:50%;background:var(--sprout);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);font-weight:700;">✓</div>
    <div style="width:44px;height:1px;background:var(--sprout);"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:var(--ink);border:1px solid var(--sprout);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sprout);">2</div>
    <div style="width:44px;height:1px;background:var(--line);"></div>
    <div style="width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim);">3</div>
    <div style="width:44px;height:1px;background:var(--line);"></div>
    <div style="width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim);">4</div>
  </div>

  <div style="width:640px;margin-top:32px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:40px;position:relative;z-index:1;">
    <div style="font-size:11px;font-weight:600;color:var(--sprout-deep);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Step 2 of 4 · Unique to Sprout</div>
    <div class="display" style="font-size:26px;letter-spacing:-.02em;margin-bottom:8px;">Set your grow-back ticker.</div>
    <p style="font-size:14.5px;color:var(--text-dim);line-height:1.6;margin:0 0 28px;max-width:48ch;">A slice of every purchase routes here automatically. Change it any time from your dashboard.</p>

    <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Route to</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;">
      <div style="padding:9px 18px;border-radius:999px;background:var(--sprout);color:var(--ink);font-size:13.5px;font-weight:600;">AAPL</div>
      <div style="padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--text-dim);">ETH</div>
      <div style="padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--text-dim);">SPY ETF</div>
      <div style="padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--text-dim);">NVDA</div>
      <div style="padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;color:var(--text-dim);">Other RWA…</div>
    </div>

    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-bottom:14px;">
      <span>Grow-back rate</span>
      <b style="color:var(--text);font-weight:600;">1.5%</b>
    </div>
    <div style="width:100%;height:4px;border-radius:99px;background:var(--line);position:relative;margin-bottom:8px;">
      <div style="position:absolute;left:0;top:0;height:4px;width:25%;border-radius:99px;background:var(--sprout);"></div>
      <div style="position:absolute;left:25%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:var(--sprout);box-shadow:0 0 0 5px rgba(216,255,77,.15);"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:32px;">
      <span>0.5%</span><span>5%</span>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:13px;color:var(--text-dim);">Back</div>
      <div style="padding:13px 28px;border-radius:999px;background:var(--sprout);color:var(--ink);font-size:14px;font-weight:600;">Continue</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
